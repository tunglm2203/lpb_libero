defaults:
  - _self_
  - task: lift_lowdim_abs

name: train_reflow_transformer_lowdim
_target_: diffusion_policy.workspace.train_reflow_transformer_lowdim_workspace.TrainReFlowTransformerLowdimWorkspace

obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
task_name: ${task.name}

horizon: 10   # this horizon is for dataloader
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False
include_reward: False
mixed_bc: False
filtered_bc: False
rollout_data: null
pretrained_checkpoint: logs/pretrain/lift_lowdim/reflow_transformer_ERate.98/reflow_transformer_ERate.98_42/checkpoints/epoch=0005-test_mean_score=0.400.ckpt

# Used during evaluation (both during training and evaluation)
test_clip_intermediate_actions: True
test_denoising_steps: 8
test_model_type: 'original'  # can be "ema", "original"

policy:
  _target_: diffusion_policy.policy.reflow_transformer_lowdim_policy.ReFlowTransformerLowdimPolicy

  model:
    _target_: diffusion_policy.model.diffusion.transformer_for_diffusion.TransformerForDiffusion
    input_dim: ${action_dim}
    output_dim: ${policy.model.input_dim}
    horizon: ${eval:'${horizon}-${n_obs_steps}+1'}
    n_obs_steps: ${n_obs_steps}
    cond_dim: ${obs_dim}

    n_layer: 8
    n_head: 4
    n_emb: 256
    p_drop_emb: 0.0
    p_drop_attn: 0.3

    causal_attn: True
    time_as_cond: True # if false, use BERT like encoder only arch, time as input
    obs_as_cond: True
    n_cond_layers: 0 # >0: use transformer encoder for cond, otherwise use MLP

  horizon: ${eval:'${horizon}-${n_obs_steps}+1'}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  sample_t_type: uniform # beta, logitnormal

ema:
  decay: 0.995

dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  lr: 1e-4
  weight_decay: 1e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  # optimization
  lr_scheduler:
    first_cycle_steps: ${training.num_epochs}
    warmup_steps: 50
    min_lr: 1e-5
  epoch_start_ema: 20
  update_ema_freq: 10
  num_epochs: 1000
  use_ema: True
  # training loop control
  # in epochs
  rollout_every: 10
  checkpoint_every: 50
  val_every: 1
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: IL-DP-2026
  resume: False
  mode: online
  name: ${name}_${training.seed}
  tags: ["${task_name}"]
  id: null
  group: ${name}

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 3
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: logs/reproduce/${task_name}/${logging.group}/${logging.name}
  wandb_name_base: ${name}_${training.seed}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: logs/reproduce/${task_name}/${logging.group}/${logging.name}
  sweep:
    dir: logs/reproduce/${task_name}/${logging.group}/${logging.name}
    subdir: ${hydra.job.num}
