task_name: transport_image
training:
  checkpoint_every: 50
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3000
  resume: true
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1

  cpl_loss_type: 'cplkl'   # 'cpl'
  use_expert_data_1: False
  use_expert_data_2: False
  n_epoch_sft: 0
  sft_type: "pos"
  stride_ratio: 0.5
  pseudo_preference: True
  dataset_1_dir: null
  dataset_2_dir: null
  preference_learning:
    num_rounds: 1
    equal_threshold: 0.05

val_dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false

