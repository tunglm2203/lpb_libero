          - 1
        robot0_eef_pos:
          shape:
          - 3
        robot0_eef_quat:
          shape:
          - 4
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb
        robot0_gripper_qpos:
          shape:
          - 2
        robot1_eef_pos:
          shape:
          - 3
        robot1_eef_quat:
          shape:
          - 4
        robot1_eye_in_hand_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb
        robot1_gripper_qpos:
          shape:
          - 2
        shouldercamera0_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb
        shouldercamera1_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb

    use_cache: true
    val_ratio: 0.0
  dataset_path: null
  dataset_type: mh
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
    abs_action: true
    crf: 22
    dataset_path: null
    fps: 10
    max_steps: 700
    n_action_steps: 15
    n_envs: 10
    n_obs_steps: 2
    n_test: 10
    n_test_vis: 4
    n_train: 0
    n_train_vis: 2
    past_action: false
    render_obs_key: shouldercamera0_image
    shape_meta:
      action:
