          - 1
        robot0_eef_pos:
          shape:
          - 3
        robot0_eef_quat:
          shape:
          - 4
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb
        robot0_gripper_qpos:
          shape:
          - 2
        robot1_eef_pos:
          shape:
          - 3
        robot1_eef_quat:
          shape:
          - 4
        robot1_eye_in_hand_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb
        robot1_gripper_qpos:
          shape:
          - 2
        shouldercamera0_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb
        shouldercamera1_image:
          shape:
          - 3
          - 140
          - 140
          type: rgb
    test_start_seed: 100000
    tqdm_interval_sec: 1.0
    train_start_idx: 0
  name: transport_image

  task_name: transport
  dense_reward: false
  dataset_1:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    dataset_path: ${training.dataset_2_dir}
    horizon: ${task.dataset.horizon}
    pad_before: ${task.dataset.pad_before}
    pad_after: ${task.dataset.pad_after}
    n_obs_steps: ${task.dataset.n_obs_steps}
    abs_action: ${task.dataset.abs_action}
    rotation_rep: ${task.dataset.rotation_rep}
    use_cache: true
    seed: 42
    val_ratio: ${task.dataset.val_ratio}
    

  dataset_2:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    dataset_path: ${training.dataset_2_dir}
    horizon: ${task.dataset.horizon}
    pad_before: ${task.dataset.pad_before}
    pad_after: ${task.dataset.pad_after}
    n_obs_steps: ${task.dataset.n_obs_steps}
    abs_action: ${task.dataset.abs_action}
    rotation_rep: ${task.dataset.rotation_rep}
    use_cache: true
    seed: 42
    val_ratio: ${task.dataset.val_ratio}
    


  pref_dataset:
    _target_: diffusion_policy.dataset.pbrl_dataset.PbrlDataset
    sequence_length: 100
    val_ratio_data1: 0
    val_ratio_data2: 0
    num_queries: 5
    gamma: ${gamma}
    gpu_device: ${training.device}
