  cond_predict_scale: true
  crop_shape:
  - 114
  - 114
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  eval_fixed_crop: true
  horizon: 32
  kernel_size: 5
  n_action_steps: 15
  n_groups: 8
  n_obs_steps: 2
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_global_cond: true
  obs_as_cond: true
  obs_encoder_group_norm: true
  shape_meta:
    action:
      shape:
      - 10
    obs:
      agentview_rgb:
        shape:
        - 3
        - 128
        - 128
        type: rgb
      # eye_in_hand_rgb:
      #   shape:
      #   - 3
      #   - 128
      #   - 128
      #   type: rgb
      ee_ori:
        shape:
        - 4
      ee_pos:
        shape:
        - 3
      joint_states:
        shape:
        - 7
      language:
        shape:
        - 15
  beta: 0.01
  bias_reg: 0.25
  bc_coef: 1.0
  ignore_equal_pref: False
  gamma: ${gamma}
  clip_margin: 0.3
  smooth_label: 0.0
  confidence_weight: False
  unclip_win: False
