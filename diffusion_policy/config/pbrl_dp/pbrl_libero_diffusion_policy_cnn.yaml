    action:
      shape:
      - 10
    obs:
      agentview_rgb:
        shape:
        - 3
        - 128
        - 128
        type: rgb
      # eye_in_hand_rgb:
      #   shape:
      #   - 3
      #   - 128
      #   - 128
      #   type: rgb
      ee_ori:
        shape:
        - 4
      ee_pos:
        shape:
        - 3
      joint_states:
        shape:
        - 7
