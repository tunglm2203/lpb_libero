        ee_ori:
          shape:
          - 4
        ee_pos:
          shape:
          - 3
        joint_states:
          shape:
          - 7
        language:
          shape:
          - 15
        rewards:
          shape:
          - 1
    use_cache: true
    val_ratio: 0.0
  dataset_path: data/libero_10/libero_10
